<main>
  <h1>{{ title() }}</h1>

  <p>Mi primera aplicación con Angular</p>
  <section>
    <h2>Lista de tareas</h2>
  
    <ul>
      @for (task of tasks(); track task.id) {
        <li>
          <input
          type="checkbox"
          [checked]="task.completed"
          (change)="toggleTask(task.id)"
           >
    
          <span>{{ task.description }}</span>
        </li>
      }
    </ul>
  </section>
</main>
