<h2 mat-dialog-title>Suspender cuenta</h2>

<mat-dialog-content>
  <p>
    ¿Confirmas que deseas suspender la cuenta de
    <strong>{{ data.userName }}</strong> ({{ data.userEmail }})?
  </p>
  <p class="warning">
    La persona perderá el acceso inmediatamente y sus sesiones dejarán de ser válidas.
  </p>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Motivo de la suspensión</mat-label>
    <textarea
      matInput
      rows="4"
      maxlength="500"
      required
      [ngModel]="reason()"
      (ngModelChange)="reason.set($event)"
      placeholder="Describe brevemente la razón"
    ></textarea>
    <mat-hint align="end">{{ reason().length }}/500</mat-hint>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancelar</button>
  <button
    mat-flat-button
    type="button"
    [disabled]="!normalizedReason()"
    [mat-dialog-close]="normalizedReason()"
  >
    Confirmar suspensión
  </button>
</mat-dialog-actions>
