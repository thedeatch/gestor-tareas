<mat-toolbar class="navbar">
  <a
    class="brand"
    routerLink="/tareas"
    aria-label="Ir a tareas"
  >
    <mat-icon>task_alt</mat-icon>
    <span>GestorTareas</span>
  </a>

  <span class="spacer"></span>

  <nav aria-label="Navegación principal">
    <a
      matButton
      routerLink="/tareas"
      routerLinkActive="active-link"
    >
      Tareas
    </a>

    <a
      matButton
      routerLink="/acerca-de"
      routerLinkActive="active-link"
    >
      Acerca de
    </a>

    @if (isAuthenticated()) {
      <span class="user-email">
        {{ userName() }}
      </span>

      <button
        matButton
        type="button"
        (click)="logout()"
      >
        <mat-icon>logout</mat-icon>
        Cerrar sesión
      </button>
    } @else {
      <a
        matButton
        routerLink="/login"
        routerLinkActive="active-link"
      >
        Iniciar sesión
      </a>
    }
  </nav>
</mat-toolbar>
