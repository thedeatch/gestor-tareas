<mat-toolbar class="navbar">
  <a
    class="brand"
    routerLink="/tareas"
    aria-label="Ir a tareas"
  >
    <mat-icon>task_alt</mat-icon>
    <span>GestorTareas</span>
  </a>

  <span class="spacer"></span>

  <nav aria-label="Navegación principal">
    <a
      matButton
      routerLink="/tareas"
      routerLinkActive="active-link"
    >
      Tareas
    </a>

    <a
      matButton
      routerLink="/acerca-de"
      routerLinkActive="active-link"
    >
      Acerca de
    </a>

    @if (isAuthenticated()) {
      @if (userRole() === 'ADMIN') {
        <a
          matButton
          routerLink="/administracion/usuarios"
          routerLinkActive="active-link"
        >
          Administración
        </a>
      }

      <a
        class="user-profile-link"
        routerLink="/perfil"
        routerLinkActive="active-link"
        aria-label="Abrir mi perfil"
      >
        <span class="user-profile-content">
          @if (avatarUrl()) {
            <img
              class="navbar-avatar"
              [src]="avatarUrl()"
              alt=""
            >
          } @else {
            <mat-icon>account_circle</mat-icon>
          }
          <span class="user-name">{{ userName() }}</span>
        </span>
      </a>

      <button
        matButton
        class="logout-button"
        type="button"
        (click)="logout()"
      >
        <mat-icon>logout</mat-icon>
        Cerrar sesión
      </button>
    } @else {
      <a
        matButton
        routerLink="/login"
        routerLinkActive="active-link"
      >
        Iniciar sesión
      </a>
    }
  </nav>
</mat-toolbar>
