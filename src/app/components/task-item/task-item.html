<mat-checkbox
  [checked]="task().completed"
  (change)="taskToggled.emit(task().id)"
  [aria-label]="'Cambiar estado de ' + task().description"
></mat-checkbox>

<span
  class="task-description"
  [class.completed]="task().completed"
>
  {{ task().description }}
</span>

<button
  mat-icon-button
  type="button"
  class="delete-button"
  [attr.aria-label]="'Eliminar ' + task().description"
  (click)="taskDeleted.emit(task().id)"
>
  <mat-icon>delete</mat-icon>
</button>
