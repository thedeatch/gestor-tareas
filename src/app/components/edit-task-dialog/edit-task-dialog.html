<h2 mat-dialog-title>
  Editar tarea
</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline">
    <mat-label>Descripción</mat-label>

    <input
      matInput
      type="text"
      name="description"
      required
      maxlength="150"
      [(ngModel)]="description"
    >

    <mat-hint align="end">
      {{ description.length }}/150
    </mat-hint>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    matButton
    type="button"
    mat-dialog-close
  >
    Cancelar
  </button>

  <button
    mat-flat-button
    type="button"
    [disabled]="!description.trim()"
    [mat-dialog-close]="description.trim()"
  >
    Guardar
  </button>
</mat-dialog-actions>
