<h2 mat-dialog-title>
  {{ data.title ?? 'Eliminar tarea' }}
</h2>

<mat-dialog-content>
  <p>
    ¿Deseas eliminar {{ data.itemLabel ?? 'la tarea' }}
    <strong>{{ data.itemName ?? data.taskDescription }}</strong>?
  </p>

  <p class="warning">
    Esta acción no se puede deshacer.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    matButton
    type="button"
    mat-dialog-close
  >
    Cancelar
  </button>

  <button
    mat-flat-button
    type="button"
    class="confirm-button"
    [mat-dialog-close]="true"
  >
    {{ data.confirmLabel ?? 'Eliminar' }}
  </button>
</mat-dialog-actions>
