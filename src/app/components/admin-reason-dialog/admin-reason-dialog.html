<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
  @if (data.warning) {
    <p class="warning">{{ data.warning }}</p>
  }

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>{{ data.reasonLabel }}</mat-label>
    <textarea
      matInput
      rows="4"
      maxlength="500"
      required
      [ngModel]="reason()"
      (ngModelChange)="reason.set($event)"
      [placeholder]="data.reasonPlaceholder"
    ></textarea>
    <mat-hint align="end">{{ reason().length }}/500</mat-hint>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancelar</button>
  <button
    mat-flat-button
    type="button"
    [disabled]="!normalizedReason()"
    [mat-dialog-close]="normalizedReason()"
  >
    {{ data.confirmText }}
  </button>
</mat-dialog-actions>
