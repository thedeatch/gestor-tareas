<h2 mat-dialog-title>Ajustar foto de perfil</h2>

<mat-dialog-content>
  <p class="instructions">
    Arrastra la imagen para enfocarla. Ajusta el zoom con la barra o con
    la rueda del mouse.
  </p>

  <div class="crop-preview">
    <canvas
      #canvas
      width="512"
      height="512"
      aria-label="Vista previa del recorte"
      [class.dragging]="isDragging"
      (pointerdown)="startDragging($event)"
      (pointermove)="drag($event)"
      (pointerup)="stopDragging($event)"
      (pointercancel)="stopDragging($event)"
      (wheel)="changeZoomWithWheel($event)"
    ></canvas>
  </div>

  <label>
    <span>Zoom</span>
    <input
      type="range"
      min="1"
      max="3"
      step="0.05"
      [(ngModel)]="zoom"
      (input)="draw()"
    >
  </label>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancelar</button>
  <button
    mat-flat-button
    type="button"
    [disabled]="!imageReady"
    (click)="confirm()"
  >
    <mat-icon>crop</mat-icon>
    Usar esta foto
  </button>
</mat-dialog-actions>
