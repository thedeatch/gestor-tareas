spring.datasource.url=jdbc:h2:mem:gestor-tareas-test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false

security.jwt.secret=test-only-secret-key-with-at-least-32-characters
security.jwt.expiration-minutes=60
security.refresh-token.expiration-days=7
security.refresh-token.cookie-secure=false
