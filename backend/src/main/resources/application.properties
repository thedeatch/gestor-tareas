spring.application.name=gestor-tareas-api
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:gestor_tareas}
spring.datasource.username=${POSTGRES_USER:gestor_tareas}
spring.datasource.password=${POSTGRES_PASSWORD:gestor_tareas_dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true