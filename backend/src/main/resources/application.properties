spring.application.name=gestor-tareas-api
server.port=${PORT:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:gestor_tareas}
spring.datasource.username=${POSTGRES_USER:gestor_tareas}
spring.datasource.password=${POSTGRES_PASSWORD:gestor_tareas_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

security.jwt.secret=${JWT_SECRET:change-this-development-secret-key-32}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
security.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:7}
security.refresh-token.cookie-secure=${REFRESH_TOKEN_COOKIE_SECURE:false}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.mail.from=${MAIL_FROM:no-reply@gestor-tareas.local}
app.password-reset.expiration-minutes=15
app.bootstrap-admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.email-verification.enabled=${EMAIL_VERIFICATION_ENABLED:true}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
