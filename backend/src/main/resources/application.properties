spring.application.name=gestor-tareas-api
server.port=${PORT:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:gestor_tareas}
spring.datasource.username=${POSTGRES_USER:gestor_tareas}
spring.datasource.password=${POSTGRES_PASSWORD:gestor_tareas_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

security.jwt.secret=${JWT_SECRET:change-this-development-secret-key-32}
security.jwt.expiration-minutes=60
