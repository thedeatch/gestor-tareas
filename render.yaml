services:
  - type: web
    name: gestor-tareas-api-thedeatch
    runtime: docker
    plan: free
    region: oregon
    branch: Dev
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: gestor-tareas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gestor-tareas-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: gestor-tareas-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: gestor-tareas-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: gestor-tareas-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRATION_DAYS
        value: "7"
      - key: REFRESH_TOKEN_COOKIE_SECURE
        value: "true"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_STARTTLS
        value: "true"
      - key: FRONTEND_URL
        value: https://gestor-tareas-web-thedeatch.onrender.com

  - type: web
    name: gestor-tareas-web-thedeatch
    runtime: static
    branch: Dev
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/gestor-tareas/browser
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /api/*
        destination: https://gestor-tareas-api-thedeatch.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: gestor-tareas-db
    plan: free
    region: oregon
    ipAllowList: []
    postgresMajorVersion: "17"
    databaseName: gestor_tareas
    user: gestor_tareas
